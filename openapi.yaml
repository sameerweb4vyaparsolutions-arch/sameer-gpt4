openapi: 3.1.0
info:
  title: Sameer GPT API
  version: 1.0.0
  description: Sends a prompt to the Sameer GPT open-source AI backend.
servers:
  - url: https://YOUR-DOMAIN.com
paths:
  /api/action/chat:
    post:
      operationId: askSameerGPT
      summary: Ask Sameer GPT a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
              required: [prompt]
      responses:
        '200':
          description: AI response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
